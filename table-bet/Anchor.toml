[toolchain]
# Not yarn: on Debian and Ubuntu the `yarn` on PATH is usually cmdtest's unrelated tool, which fails
# with "no such option: -p" rather than anything that hints at the real problem.
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
table_bet = "9FMrUJ9Ahmxqagixp89t29rs6HoP5KckZLtsgVrnnrAU"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# solana-test-validator defaults its gossip port to 8000 and panics outright if anything already holds
# it, which on a development machine something usually does. gossip_port must also sit outside
# dynamic_port_range, or it fails a second way while reporting the same thing.
[test]
startup_wait = 40000

[test.validator]
# Anchor otherwise passes --bind-address 0.0.0.0, and the validator refuses to work out a gossip
# address from that once the port is given explicitly.
bind_address = "127.0.0.1"
gossip_port = 8011
dynamic_port_range = "8012-8040"
